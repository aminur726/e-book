version: "3.9"  # optional, can be removed if using modern Docker Compose

services:
  ebook-app:
    image: aminur726/e-book:ebook-app-service-1.0.0
    container_name: ebook-app
    restart: unless-stopped
    ports:
      - "80:80"  # host:container port mapping
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=80
      - STREAMLIT_SERVER_MAXUPLOADSIZE=200
      - STREAMLIT_BROWSER_GATHERUSAGESTATS=false
    volumes:
      - ./data:/app/data  # optional: persist any data locally
